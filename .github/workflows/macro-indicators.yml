name: macro-indicators

on:
  workflow_dispatch:        # 手動觸發
  repository_dispatch:      # cron-job.org / 用戶觸發
    types: [macro-indicators]

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # 推 cache/*.json 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run macro_indicators crawler
        run: python crawlers/macro_indicators.py

      - name: Commit & push cache
        run: |
          git config user.email "136291581+yyvdbLCY@users.noreply.github.com"
          git config user.name "yyvdbLCY"
          git add cache/macro_indicators.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "data: update macro_indicators cache [skip ci]"
            git push
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
